# Nginx configuration for SafeBarangay SPA
# Replace server_name with your domain
# Replace root path with your actual dist directory

server {
    listen 80;
    server_name _;  # Change to your domain (e.g., example.com)

    # Set root to your dist directory
    root /var/www/safebarangay/dist;  # Adjust path as needed
    index index.html;

    # Gzip compression
    gzip on;
    gzip_types text/css application/javascript application/json;

    # SPA routing: try file, then directory, then fallback to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache busting for static assets with hashes
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Don't cache index.html
    location = /index.html {
        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Optional: if you want HTTPS, uncomment below after setting up SSL cert
    # listen 443 ssl http2;
    # ssl_certificate /etc/ssl/certs/your-cert.crt;
    # ssl_certificate_key /etc/ssl/private/your-key.key;
    # ssl_protocols TLSv1.2 TLSv1.3;
}

